<svg width="360" height="210" xmlns="http://www.w3.org/2000/svg">
<style>
svg {
  font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif, Apple Color Emoji, Segoe UI Emoji;
  font-size: 14px;
  line-height: 21px;
}

#background {
  width: calc(100% - 10px);
  height: calc(100% - 10px);
  fill: #00000000;
  stroke: #9745F533;
  stroke-width: 1px;
  rx: 6px;
  ry: 6px;
}

foreignObject {
  width: calc(100% - 10px - 32px);
  height: calc(100% - 10px - 24px);
}

h2 {
  margin-top: 0;
  margin-bottom: 0.75em;
  line-height: 24px;
  font-size: 16px;
  font-weight: 600;
  color: #9745f5;
  fill: #9745f5;
}

.pie-wrapper {
  display: flex;
  align-items: center;
}

.pie {
  width: 92px;
  height: 92px;
  min-width: 92px;
  border-radius: 50%;
  margin-right: 18px;
  /* Donut hole via CSS mask. Must use "white" (not "black") for the
     visible ring: mask uses luminance by default, and black has zero
     luminance, so a black ring would mask itself away too. */
  -webkit-mask: radial-gradient(circle, transparent 55%, white 56%);
  mask: radial-gradient(circle, transparent 55%, white 56%);
}

ul {
  list-style: none;
  padding-left: 0;
  margin-top: 0;
  margin-bottom: 0;
  columns: 3;
  column-gap: 8px;
}

li {
  display: flex;
  align-items: center;
  font-size: 10.5px;
  margin-bottom: 4px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  break-inside: avoid;
  transform: translateX(-500%);
  animation-duration: 1s;
  animation-name: slideIn;
  animation-function: ease-in-out;
  animation-fill-mode: forwards;
}

@keyframes slideIn {
  to {
    transform: translateX(0);
  }
}

div.ellipsis {
  height: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
}

.octicon {
  fill: #9f4bff;
  margin-right: 0.5ch;
  vertical-align: top;
}

.lang {
  font-weight: 600;
  margin-right: 4px;
  color: #a78bfa;
}

.percent {
  color: #8f6fc9;
}
</style>
<g>
<rect x="5" y="5" id="background" />
